<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJT学習手帳</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#39C5BB">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BJT手帳">
<style>
  :root {
    --bg: #0A0E16;
    --bg-panel: #121826;
    --bg-panel-2: #1B2333;
    --teal: #39C5BB;
    --teal-bright: #6BFFE8;
    --teal-dim: rgba(57,197,187,0.14);
    --teal-border: rgba(57,197,187,0.38);
    --pink: #FF6FA5;
    --pink-dim: rgba(255,111,165,0.14);
    --pink-border: rgba(255,111,165,0.45);
    --text: #EAF6F4;
    --text-soft: #93A6B0;
    --text-faint: #5C6B75;
    --track: #1E2733;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", Roboto, sans-serif;
    --font-mono: "SF Mono", "Roboto Mono", ui-monospace, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-display);
    -webkit-font-smoothing: antialiased; padding: 20px 16px 64px; line-height: 1.6;
    background-image: radial-gradient(circle at 15% 0%, rgba(57,197,187,0.08), transparent 45%), radial-gradient(circle at 85% 10%, rgba(255,111,165,0.05), transparent 40%);
  }
  .app { max-width: 620px; margin: 0 auto; }

  .masthead { margin-bottom: 16px; border-bottom: 1px solid var(--teal-border); padding-bottom: 14px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.16em; color: var(--teal); font-weight: 700; text-transform: uppercase; }
  .masthead h1 { font-size: 28px; margin: 4px 0 2px; letter-spacing: 0.02em; font-weight: 800; color: var(--text); text-shadow: 0 0 18px rgba(57,197,187,0.55), 0 0 2px rgba(107,255,232,0.6); }
  .masthead .sub { margin: 0 0 10px; color: var(--text-soft); font-size: 13px; }
  .eq-bars { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
  .eq-bars span { display: block; width: 3px; background: var(--teal); border-radius: 2px; box-shadow: 0 0 6px var(--teal); animation: eqPulse 1.1s ease-in-out infinite; }
  .eq-bars span:nth-child(1){ height:40%; animation-delay: 0s; }
  .eq-bars span:nth-child(2){ height:100%; animation-delay: .15s; }
  .eq-bars span:nth-child(3){ height:60%; animation-delay: .3s; }
  .eq-bars span:nth-child(4){ height:90%; animation-delay: .45s; }
  .eq-bars span:nth-child(5){ height:50%; animation-delay: .6s; }
  @keyframes eqPulse { 0%,100% { transform: scaleY(0.4); opacity: .6; } 50% { transform: scaleY(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .eq-bars span { animation: none; transform: scaleY(0.7); } }

  .tabbar { display: flex; gap: 6px; margin-bottom: 18px; }
  .tab-btn { flex: 1; padding: 10px 6px; text-align: center; font-family: var(--font-display); font-size: 13px; font-weight: 700; border: 1.5px solid var(--teal-border); background: var(--bg-panel); color: var(--text-soft); border-radius: 3px; cursor: pointer; }
  .tab-btn.active { background: var(--teal); color: #06171A; border-color: var(--teal); box-shadow: 0 0 16px rgba(57,197,187,0.55); }

  .stampcard { background: var(--bg-panel); border: 1px solid var(--teal-border); border-radius: 8px; padding: 18px 18px 20px; margin-bottom: 18px; box-shadow: 0 0 24px rgba(57,197,187,0.06) inset; }
  .streak-numbers { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }
  .streak-block { display: flex; flex-direction: column; }
  .streak-num { font-family: var(--font-mono); font-size: 40px; font-weight: 700; line-height: 1; color: var(--teal-bright); text-shadow: 0 0 16px rgba(107,255,232,0.6); }
  .streak-num.muted { color: var(--text-soft); text-shadow: none; }
  .streak-label { font-size: 11px; color: var(--text-faint); margin-top: 4px; letter-spacing: 0.02em; }
  .streak-divider { width: 1px; height: 34px; background: var(--teal-border); }
  .stamp-row { display: flex; justify-content: space-between; gap: 4px; margin-bottom: 16px; padding: 4px 0; overflow-x: auto; }
  .stamp-day { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; min-width: 0; }
  .stamp-dot { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--track); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--teal-bright); font-weight: 700; flex-shrink: 0; background: var(--bg); }
  .stamp-dot.filled { border-color: var(--teal); background: var(--teal-dim); box-shadow: 0 0 10px rgba(57,197,187,0.65); }
  .stamp-dot.today-ring { box-shadow: 0 0 0 2px var(--bg-panel), 0 0 0 3.5px var(--pink); }
  .stamp-dot.filled.today-ring { box-shadow: 0 0 0 2px var(--bg-panel), 0 0 0 3.5px var(--pink), 0 0 10px rgba(57,197,187,0.65); }
  .stamp-day-num { font-size: 9px; color: var(--text-faint); font-family: var(--font-mono); }
  @keyframes stampPress { 0% { transform: scale(1.8) rotate(-18deg); opacity: 0; } 55% { transform: scale(0.88) rotate(-3deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
  .just-stamped { animation: stampPress 420ms ease-out; }
  .stamp-btn { width: 100%; padding: 12px; background: var(--teal); color: #06171A; border: none; border-radius: 4px; font-family: var(--font-display); font-size: 14px; font-weight: 800; letter-spacing: 0.02em; cursor: pointer; box-shadow: 0 0 18px rgba(57,197,187,0.4); }
  .stamp-btn:active { opacity: 0.85; }
  .stamp-btn.done { background: var(--bg); color: var(--teal-bright); border: 1.5px solid var(--teal); box-shadow: none; cursor: default; }

  .progress-overview { margin-bottom: 16px; }
  .progress-text { font-size: 13px; color: var(--text-soft); margin-bottom: 6px; font-family: var(--font-mono); }
  .progress-text b { color: var(--teal-bright); font-size: 15px; }
  .progress-bar-track { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--teal-bright)); border-radius: 3px; transition: width 300ms ease; box-shadow: 0 0 8px rgba(57,197,187,0.6); }

  .kanji-summary { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); border: 1px solid var(--pink-border); border-radius: 8px; padding: 14px 16px; margin-bottom: 22px; }
  .kanji-summary-text { font-size: 13px; color: var(--text-soft); }
  .kanji-summary-text b { color: var(--pink); font-family: var(--font-mono); font-size: 15px; }
  .kanji-summary-btn { padding: 8px 14px; border-radius: 4px; border: 1.5px solid var(--pink); background: none; color: var(--pink); font-family: var(--font-display); font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; margin-left: 10px; }
  .kanji-summary-btn:active { background: var(--pink-dim); }

  .tier { margin-bottom: 16px; border: 1px solid var(--teal-border); border-radius: 8px; overflow: hidden; background: var(--bg-panel); }
  .tier-head { background: var(--bg-panel-2); border-left: 3px solid var(--teal); color: var(--text); padding: 10px 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .tier-head .tier-title { font-size: 14px; font-weight: 700; letter-spacing: 0.02em; color: var(--teal-bright); }
  .tier-head .tier-sub { font-size: 10.5px; color: var(--text-faint); }
  .tier-head .tier-count { font-family: var(--font-mono); font-size: 12px; color: var(--text-soft); flex-shrink: 0; margin-left: 8px; }
  .item-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid rgba(57,197,187,0.12); cursor: pointer; user-select: none; }
  .item-row:first-of-type { border-top: none; }
  .item-row:active { background: var(--bg-panel-2); }
  .item-mark { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; border: 1.5px solid var(--track); }
  .item-mark.s0 { background: transparent; color: var(--text-faint); }
  .item-mark.s1 { background: var(--bg); border-color: var(--teal); }
  .item-mark.s1::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 6px var(--teal); }
  .item-mark.s2 { border-color: var(--teal); background: var(--teal-dim); color: var(--teal-bright); box-shadow: 0 0 8px rgba(57,197,187,0.55); }
  .item-text { flex: 1; min-width: 0; }
  .item-jp { font-size: 14px; font-weight: 600; color: var(--text); }
  .item-row[data-status="0"] .item-jp { color: var(--text-soft); font-weight: 500; }
  .item-reading { font-size: 11px; color: var(--teal-bright); margin-top: 1px; font-family: var(--font-mono); }
  .item-vn { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; }
  .item-state-label { font-size: 11px; font-weight: 700; color: var(--text-faint); flex-shrink: 0; width: 16px; text-align: center; }
  .item-row[data-status="2"] .item-state-label { color: var(--teal-bright); }
  .item-row[data-status="1"] .item-state-label { color: var(--teal); }

  .footer { text-align: center; margin-top: 28px; }
  .reset-link { font-size: 11px; color: var(--text-faint); text-decoration: underline; cursor: pointer; background: none; border: none; font-family: var(--font-display); }
  .loading { text-align: center; color: var(--text-soft); padding: 40px 0; font-size: 13px; }

  .deck-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .deck-card { background: var(--bg-panel); border: 1.5px solid var(--teal-border); border-radius: 8px; padding: 16px 14px; cursor: pointer; text-align: left; }
  .deck-card:active { background: var(--bg-panel-2); box-shadow: 0 0 14px rgba(57,197,187,0.3); }
  .deck-card .deck-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; color: var(--text); }
  .deck-card .deck-meta { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); }

  .card-deckbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .deckbar-back { font-size: 12px; color: var(--text-soft); background: none; border: none; cursor: pointer; text-decoration: underline; font-family: var(--font-display); }
  .card-progress { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); }

  .flip-scene { perspective: 1200px; margin-bottom: 18px; }
  .flip-card { position: relative; width: 100%; min-height: 220px; transform-style: preserve-3d; transition: transform 420ms cubic-bezier(.4,.2,.2,1); cursor: pointer; }
  .flip-card.flipped { transform: rotateY(180deg); }
  .flip-face { position: absolute; inset: 0; backface-visibility: hidden; border: 1.5px solid var(--teal-border); border-radius: 10px; background: var(--bg-panel); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; box-shadow: 0 0 26px rgba(57,197,187,0.1); }
  .flip-face.back { transform: rotateY(180deg); background: linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel)); border-color: var(--pink-border); }
  .flip-hint { position: absolute; top: 10px; right: 12px; font-size: 10px; color: var(--text-faint); letter-spacing: 0.08em; }
  .flip-face.back .flip-hint { color: var(--pink); opacity: 0.7; }
  .card-term { font-size: 26px; font-weight: 800; line-height: 1.3; color: var(--text); text-shadow: 0 0 14px rgba(57,197,187,0.35); }
  .card-reading { font-size: 20px; font-weight: 700; color: var(--teal-bright); margin-top: 4px; }
  .card-meaning { font-size: 17px; font-weight: 600; margin-top: 6px; color: var(--text); }
  .card-explain { font-size: 13px; color: var(--text-soft); margin-top: 12px; line-height: 1.7; white-space: pre-line; }

  .card-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .card-btn { padding: 12px; border-radius: 4px; font-family: var(--font-display); font-size: 13px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--teal-border); background: var(--bg-panel); color: var(--text); }
  .card-btn.again { color: var(--text-soft); }
  .card-btn.know { background: var(--teal-dim); border-color: var(--teal); color: var(--teal-bright); }
  .card-nav { display: flex; justify-content: space-between; }
  .nav-btn { padding: 10px 16px; border-radius: 4px; font-family: var(--font-display); font-size: 13px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--teal-border); background: none; color: var(--text-soft); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .quiz-prompt { font-size: 12px; color: var(--text-faint); margin-bottom: 6px; font-weight: 700; letter-spacing: 0.03em; }
  .quiz-term-reading { font-size: 12px; color: var(--teal-bright); margin-bottom: 4px; font-family: var(--font-mono); }
  .quiz-sentence { background: var(--bg-panel); border: 1.5px solid var(--teal-border); border-radius: 10px; padding: 20px 18px; font-size: 16px; line-height: 1.7; margin-bottom: 16px; font-weight: 600; color: var(--text); white-space: pre-line; }
  .quiz-sentence .blank { display: inline-block; border-bottom: 2px solid var(--pink); min-width: 46px; color: var(--pink); }
  .quiz-sentence.kanji-term { text-align: center; font-size: 30px; font-weight: 800; padding: 30px 18px; text-shadow: 0 0 16px rgba(57,197,187,0.4); }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .quiz-opt { padding: 13px 16px; border: 1.5px solid var(--teal-border); border-radius: 6px; background: var(--bg-panel); font-family: var(--font-display); font-size: 14px; font-weight: 600; text-align: left; cursor: pointer; color: var(--text); }
  .quiz-opt:active { background: var(--bg-panel-2); }
  .quiz-opt.correct { background: var(--teal-dim); border-color: var(--teal); color: var(--teal-bright); box-shadow: 0 0 12px rgba(57,197,187,0.4); }
  .quiz-opt.wrong { background: var(--pink-dim); border-color: var(--pink); color: var(--pink); }
  .quiz-opt.disabled { cursor: default; }
  .quiz-opt.exam-selected { background: var(--teal-dim); border-color: var(--teal); color: var(--teal-bright); box-shadow: 0 0 12px rgba(57,197,187,0.4); }
  .opt-reading { display: block; font-size: 10.5px; color: var(--text-faint); font-family: var(--font-mono); margin-bottom: 2px; }
  .quiz-opt.correct .opt-reading, .quiz-opt.wrong .opt-reading { color: inherit; opacity: 0.8; }
  .opt-term { display: block; }

  .feedback-box { border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .feedback-box.ok { background: var(--teal-dim); border: 1.5px solid var(--teal); }
  .feedback-box.bad { background: var(--pink-dim); border: 1.5px solid var(--pink); }
  .feedback-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
  .feedback-box.ok .feedback-title { color: var(--teal-bright); }
  .feedback-box.bad .feedback-title { color: var(--pink); }
  .feedback-explain { font-size: 13px; color: var(--text-soft); line-height: 1.7; }

  .quiz-score { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); margin-bottom: 12px; }
  .quiz-next-btn { width: 100%; padding: 13px; background: var(--teal); color: #06171A; border: none; border-radius: 5px; font-family: var(--font-display); font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 0 16px rgba(57,197,187,0.4); }

  .result-box { text-align: center; padding: 30px 16px; }
  .result-score { font-family: var(--font-mono); font-size: 46px; font-weight: 800; color: var(--teal-bright); text-shadow: 0 0 20px rgba(107,255,232,0.6); }
  .result-label { font-size: 13px; color: var(--text-faint); margin-top: 4px; margin-bottom: 24px; }
  .result-actions { display: flex; flex-direction: column; gap: 10px; }

  /* ===== 模試 (mock exam) ===== */
  .exam-intro { background: var(--bg-panel); border: 1.5px solid var(--teal-border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  .exam-notice { font-size: 12.5px; color: var(--text-soft); line-height: 1.6; background: var(--bg); border: 1px solid var(--teal-border); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
  .exam-start-btn { width: 100%; padding: 14px; background: var(--pink); color: #2A0A16; border: none; border-radius: 5px; font-family: var(--font-display); font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 0 18px rgba(255,111,165,0.4); }
  .exam-history { margin-top: 18px; }
  .exam-history-title { font-size: 13px; font-weight: 700; color: var(--text-soft); margin-bottom: 8px; }
  .exam-history-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid var(--teal-border); border-radius: 6px; margin-bottom: 6px; font-size: 12.5px; }
  .exam-history-score { font-family: var(--font-mono); font-weight: 800; color: var(--teal-bright); }
  .exam-history-meta { color: var(--text-faint); font-size: 11px; }
  .exam-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
  .exam-timer { font-family: var(--font-mono); font-size: 20px; font-weight: 800; padding: 6px 12px; border-radius: 6px; background: var(--bg-panel); border: 1.5px solid var(--teal-border); color: var(--teal-bright); }
  .exam-timer.warn { color: var(--pink); border-color: var(--pink); animation: eqPulse 1s ease-in-out infinite; }
  .exam-submit-btn { padding: 8px 14px; border-radius: 5px; border: 1.5px solid var(--pink); background: none; color: var(--pink); font-family: var(--font-display); font-size: 12px; font-weight: 700; cursor: pointer; }
  .exam-section-label { font-size: 11px; font-weight: 700; color: var(--pink); letter-spacing: 0.05em; margin-bottom: 8px; }
  .exam-passage { background: var(--bg); border: 1px solid var(--teal-border); border-radius: 8px; padding: 14px 16px; font-size: 13px; line-height: 1.7; color: var(--text-soft); white-space: pre-line; margin-bottom: 14px; max-height: 260px; overflow-y: auto; }
  .exam-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 14px 0; }
  .exam-grid-btn { aspect-ratio: 1; border-radius: 4px; border: 1.5px solid var(--track); background: var(--bg-panel); color: var(--text-faint); font-family: var(--font-mono); font-size: 11px; cursor: pointer; }
  .exam-grid-btn.current { border-color: var(--pink); box-shadow: 0 0 8px rgba(255,111,165,0.5); color: var(--pink); }
  .exam-grid-btn.answered { border-color: var(--teal); color: var(--teal-bright); background: var(--teal-dim); }
  .exam-nav { display: flex; gap: 10px; margin-top: 14px; }
  .exam-nav button { flex: 1; padding: 12px; border-radius: 5px; font-family: var(--font-display); font-size: 13px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--teal-border); background: var(--bg-panel); color: var(--text); }
  .exam-nav button:disabled { opacity: 0.3; }
  .exam-result-section { margin-top: 22px; }
  .exam-result-section h3 { font-size: 13px; color: var(--teal-bright); border-bottom: 1px solid var(--teal-border); padding-bottom: 6px; }
  .exam-review-item { border: 1px solid var(--teal-border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; font-size: 12.5px; }
  .exam-review-item.wrong { border-color: var(--pink-border); }
  .exam-review-q { color: var(--text-soft); margin-bottom: 6px; }
  .exam-review-ans { font-weight: 700; }
  .exam-review-ans.ok { color: var(--teal-bright); }
  .exam-review-ans.bad { color: var(--pink); }

  /* ===== 復習 (spaced repetition) ===== */
  .review-hero { text-align: center; padding: 26px 16px; }
  .review-due-num { font-family: var(--font-mono); font-size: 44px; font-weight: 800; color: var(--pink); text-shadow: 0 0 18px rgba(255,111,165,0.5); }
  .review-empty { text-align: center; padding: 40px 16px; color: var(--text-soft); font-size: 13.5px; line-height: 1.7; }

  /* ===== backup / export ===== */
  .backup-row { display: flex; gap: 10px; margin-top: 10px; }
  .backup-btn { flex: 1; padding: 10px; border-radius: 5px; border: 1.5px solid var(--teal-border); background: var(--bg-panel); color: var(--text-soft); font-family: var(--font-display); font-size: 12px; font-weight: 700; cursor: pointer; }

  /* ===== 聴解 (listening, TTS-based) ===== */
  .tts-badge { display: flex; align-items: center; gap: 8px; background: var(--pink-dim); border: 1px solid var(--pink-border); border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 11.5px; color: var(--text-soft); line-height: 1.7; }
  .tts-badge b { color: var(--pink); }
  .play-btn { width: 100%; padding: 22px 16px; background: var(--bg-panel); border: 1.5px solid var(--teal); border-radius: 10px; color: var(--teal-bright); font-family: var(--font-display); font-size: 15px; font-weight: 800; cursor: pointer; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 0 20px rgba(57,197,187,0.15) inset; }
  .play-btn:active { background: var(--teal-dim); }
  .play-btn.playing { border-color: var(--pink); color: var(--pink); box-shadow: 0 0 20px rgba(255,111,165,0.18) inset; }

      { id:'l3-12', audioFile:'Track39.mp3', setup:'女の人が男の人に自動車部品のサンプルを見せながら話しています。男の人は何に一番興味を持ちましたか。',

  const READING_PASSAGES = [
    { id:"rd-1", topic:"雇用契約書", passage:"次の文章は、雇用者甲と被雇用者乙との間に交わされた雇用契約書の一部です。2006年4月1日以降も現在と同条件で契約を続けたい場合、2006年3月1日までに何をしなければなりませんか。\n\n第15条（契約の期間）\n　委嘱期間は2005年4月1日から2006年3月31日までとする。\n　ただし、有効期間満了30日前までに、甲乙いずれかが口頭または書面により、この契約の改訂を申し出ない場合には、同一条件をもって自動的にさらに1年延長するものとし、以後この例にならうものとする。", question:"2006年4月1日以降も現在と同条件で契約を続けたい場合、2006年3月1日までに何をしなければなりませんか。", options:["口頭による継続手続き","書面による継続手続き","口頭と書面による継続手続き","継続手続きの必要はない"], correct:3, explain:"Hợp đồng có điều khoản tự động gia hạn thêm 1 năm với cùng điều kiện, TRỪ KHI một trong hai bên chủ động đề nghị thay đổi (bằng lời hoặc văn bản) trước 30 ngày khi hết hạn. Vì muốn giữ nguyên điều kiện cũ nên không cần làm gì cả — đáp án 4." },
    { id:"rd-2", topic:"取引先からの文書（事業所移転の通知）", passage:"取引先から次のような文書が届きました。どのような内容の文書ですか。\n\n拝啓　貴社ますますご清栄のこととお喜び申し上げます。平素は格別のお引き立てを賜り厚く御礼申し上げます。\n　さて、弊社は、大阪地区における営業体制の一層の強化充実と業務拡大を図るため、事業所名を大阪営業所から大阪本社と改め、併せて下記の通り移転致しますので、ご連絡申し上げます。\n　なお、電話・ファックス番号は変更がありません。従来にも増して営業・サービス活動の一層の向上に努めて参りますので、倍旧のご鞭撻を賜りますようお願い申し上げます。\n敬具\n新住所　〒535-○○○○　大阪府……", question:"どのような内容の文書ですか。", options:["事業部の営業体制の強化と拡大のお知らせ","社名変更のお知らせ","事業所名と住所の変更のお知らせ","電話番号とファックス番号の変更のお知らせ"], correct:2, explain:"Văn bản có 3 phần: tiền văn (chào hỏi), chính văn (bắt đầu bằng 'さて' — nội dung chính: đổi tên và chuyển địa điểm văn phòng), hậu văn. Phần quan trọng nhất nằm sau 'さて': đổi tên văn phòng + chuyển địa chỉ mới → đáp án 3." },
    { id:"rd-3", topic:"社内報：社長の談話", passage:"次の記事は社内報に載った社長の談話です。この会社が最も大切にしていることは何ですか。\n\nわが業界の年間受注額は5年前のピーク以降、年々減少しています。それにもかかわらず、わが社の受注額はこの間、年平均5%の増加を示しています。これは、当社が\"お客さまの信用\"を基本方針として、お客さまに満足していただけるよう、仕事の規模の大小を問わず地道な努力を重ねてきた結果であると確信しております。従業員の皆さんも、この方針にのっとり、同業他社との競争に打ち勝つよう頑張ってこられました。あらためて皆さんに深い敬意と感謝の意を表したいと思います。\n　また、当社がこれまで取り組んできた地球環境問題や地域社会との交流も引き続き行い、今後も社会のお役に立ちたいと考えております。", question:"この会社が最も大切にしていることは何ですか。", options:["業界での立場","顧客の満足","地球環境問題への取り組み","地域社会との交流"], correct:1, explain:"Trong bài phát biểu, chủ tịch nêu 3 việc: (1) lấy 'sự tín nhiệm của khách hàng' làm phương châm cơ bản để nâng cao sự hài lòng của khách hàng, (2) tham gia vấn đề môi trường, (3) giao lưu với cộng đồng. Câu hỏi là 'điều quan trọng NHẤT' → chính là phương châm cơ bản của công ty = sự hài lòng của khách hàng → đáp án 2." },
    { id:"rd-4", topic:"決裁書", passage:"次の文書は、高額支出の承認を申請する決裁書です。何を目的として支出の承認を申請していますか。\n\n決裁書\n件名：顧客オンライン・システムの開発\n下記支出につき、ご承認をお願いいたします。\n1. 金額：10,000,000円（予算外）\n2. 目的：今年度の重点経営施策の一環として承認された社内情報システムの合理化については、担当部としてソフト開発を前倒しするなど努力しているところです。さて、このたび営業部門から、MJ商事と当社の間のオンラインによるデータ交換システムの構築について、緊急の要請がありました。本システム開発後は社内システムとの連動による合理化効果も大きいと予想されます。つきましては、現在、社内情報システムの開発で社内人員に余力がないため、本システム開発において、基本設計以外をすべてアウトソーシングにより実施したいと考えます。以上から、本費用の支出にご承認をお願いいたします。", question:"何を目的として支出の承認を申請していますか。", options:["社内情報システムの開発","社内データ交換システムの開発","顧客間オンライン・システムの開発","アウトソーシングによる顧客オンライン・システムの開発"], correct:3, explain:"'目的' phần quan trọng nằm sau 'さて': (1) yêu cầu khẩn từ bộ kinh doanh về xây dựng hệ thống trao đổi dữ liệu online với công ty MJ, (2) do nhân sự nội bộ không đủ nên muốn outsource toàn bộ trừ thiết kế cơ bản. Mục đích chi tiền = phát triển hệ thống online cho khách hàng bằng cách outsourcing → đáp án 4." },
    { id:"rd-5", topic:"取引先への文書（見本送付の連絡）", passage:"次の文は、ある会社へあてた文書です。主要な用件は何ですか。\n\n拝啓　時下ますますご清栄のこととお喜び申し上げます。\n　先日は私どもの新商品説明会に貴重なお時間を割いてご出席いただき、誠にありがとうございました。\n　当日ご要望のありました商品の見本はただいま製作中でございます。今月20日に発送の予定でございますので、少々お待ちいただきますようお願い申し上げます。\n　なお、仕様書を同封いたしましたので、あらかじめご検討ください。ご質問、ご要望などございましたら、ご遠慮なくお問い合わせください。まずは取り急ぎ要件まで。\n敬具", question:"主要な用件は何ですか。", options:["新商品説明会出席へのお礼","商品見本の製作日について","商品見本の納期について","仕様書の検討依頼"], correct:2, explain:"Văn bản gồm tiền văn (cảm ơn đã tham dự — mang tính hình thức) và chính văn thật sự bắt đầu từ 'ただいま製作中' → thông báo ngày giao hàng mẫu (20 ngày này). 'なお' phía sau (về tài liệu quy cách) chỉ là thông tin phụ, không phải trọng tâm → đáp án 3 (thời hạn giao mẫu hàng)." },
    { id:"rd-6", topic:"決算に関するグラフ問題", passage:"下のグラフは次の記事を単純化して示したものです。グラフ中のCは固定費です。A、B、Dは、売上高、変動費、総コストのそれぞれ何を表していますか。\n\n明暗を分けた決算\n　製薬会社のX社とY社の20**年度の決算が発表された。両社は同種の薬品をほぼ同量生産・販売し、売上高もほとんど同じでありながら利益額ではY社はX社の6割にも満たない。財務諸表を比較分析した結果、両社の収益力の差はコスト構造の差にあることが分かった。つまりX社は効率化を徹底して、固定費を大幅に削減し、変動費を含む総コストを抑え、損益分岐点を引き下げることに成功した。", question:"A、B、Dは、売上高、変動費、総コストのそれぞれ何を表していますか。", options:["Aは売上高　Bは変動費　Dは総コスト","Aは売上高　Bは総コスト　Dは変動費","Aは総コスト　Bは変動費　Dは売上高","Aは総コスト　Bは売上高　Dは変動費"], correct:1, explain:"Bài báo nói '売上高 của 2 công ty gần như bằng nhau' → đường A hoặc D (2 đường gần trùng nhau ở biểu đồ) là doanh số. X社 đã 'giảm mạnh chi phí cố định, kìm hãm tổng chi phí bao gồm cả biến phí' → tổng chi phí (đường B) và biến phí (đường D) đều giảm ở X社 so với Y社. Kết hợp: A=売上高, B=総コスト, D=変動費 → đáp án 2." },
    { id:"rd-7", topic:"Eメール（新製品説明の申し出）", passage:"さくら工業の佐藤さんから次のようなメールが届きました。メールの用件は何ですか。\n\n件名：小社新製品のご説明に関して\nカトウ商事（株）　鈴木昭夫様\n\nメールを拝読いたしました。弊社の新製品にお問い合わせをいただき、お礼申し上げます。\n早速ですが、製品のご説明に伺いたいと思います。来週、以下のどちらかで御社に伺わせていただきたいのですが、いかがでしょうか。\n日時：10/18（月）10:00〜11:00　　10/19（火）9:30〜10:30\n資料を見ながらのご説明に1時間ほどいただければと思っております。ご連絡をお待ちしております。\nさくら工業（株）佐藤一郎", question:"メールの用件は何ですか。", options:["鈴木さんにさくら工業まで来てほしい。","鈴木さんあてに資料を送る。","さくら工業で2回、説明会を開きたい。","カトウ商事で製品の説明をしたい。"], correct:3, explain:"Người gửi (さくら工業の佐藤) muốn đến CÔNG TY của người nhận (カトウ商事) để giải thích sản phẩm ('御社に伺わせていただきたい' = xin phép được đến quý công ty), đề xuất 2 khung giờ để người nhận CHỌN 1 (không phải tổ chức 2 lần) → đáp án 4." },
    { id:"rd-8", topic:"取引先からの文書（棚卸し協力依頼）", passage:"取引先から次のような文書が届きました。主要な用件は何ですか。\n\n拝啓　時下ますますご隆昌の段お喜び申し上げます。平素は当社の製品在庫に関する受け払い作業、並びに在庫棚卸し業務等につき、良好な管理をしていただき厚く御礼申し上げます。\n　さて、早速ですが、最近の傾向として在庫品の品目数および金額が顕著に増加してきており、その削減対策のため全在庫品につき流動性等の実態を早急に把握する必要性が出てまいりました。つきましては、お忙しいところ恐縮ですが今月末に臨時の全在庫棚卸しを実施いたしたく貴社の全面的なご協力をお願い致します。\n　今回は従来の抜き取り方式ではなく全品棚卸しとなりますので貴社には相当のご負担をお掛けすることになりますが、以上の事情をご賢察の上よろしくお願いする次第です。なお、その際最近3年間の在庫品受け払いデータをご用意ください。", question:"主要な用件は何ですか。", options:["良好な在庫管理へのお礼","在庫品の削減対策依頼","在庫品の全品棚卸しへの協力依頼","在庫品の受け払いデータ提出依頼"], correct:2, explain:"Chính văn (sau 'さて'): do lượng tồn kho tăng đáng kể nên cần nắm thực trạng gấp → 'つきましては' đưa ra yêu cầu chính: hợp tác kiểm kê TOÀN BỘ hàng tồn kho cuối tháng này (thay vì kiểm mẫu như trước). Yêu cầu về dữ liệu 3 năm chỉ là phụ ('なお') → đáp án 3." },
    { id:"rd-9", topic:"業績予想の記事", passage:"次の記事は、ある会社の業績予想の一部です。利益が下がる主な理由は何だと言っていますか。\n\n今期の売上は国内、国外とも順調で、年初予想の1,000億円到達は無理としても前期比10%増は可能と見込まれている。\n経費面で、前期に実施した人員合理化の効果に加え、販売管理費等の削減などプラス要因はあったものの、原油価格上昇に伴う原料費の増加が大きなマイナス要因となった。その結果、コスト削減の努力も及ばず、減益となりそうだ。", question:"利益が下がる主な理由は何だと言っていますか。", options:["売上が年初の予想を下回りそうなこと。","人員合理化の効果が小さかったこと。","販売管理費の削減ができなかったこと。","原油価格が上昇し、原料費が増加したこと。"], correct:3, explain:"Doanh số thực tế vẫn tăng tốt (chỉ không đạt mục tiêu ban đầu, không phải nguyên nhân giảm lợi nhuận). Về chi phí: nhân sự và chi phí quản lý bán hàng đều là yếu tố TÍCH CỰC (đã giảm), nhưng giá dầu tăng kéo theo chi phí nguyên liệu tăng là yếu tố TIÊU CỰC lớn nhất khiến lợi nhuận giảm → đáp án 4." },
    { id:"rd-10", topic:"招待状", passage:"次のような文書が来ました。これを受け取った人は何に招待されましたか。\n\n丸友信託銀行　国際投資部　本田様\n拝啓　貴社ますますご清栄のこととお喜び申し上げます。平素より多大なるご協力を賜り、厚く御礼申し上げます。\n　さて、このたび欧州におけるソフトウェア業界を代表する企業でありますMAP社より、財務担当責任者であるR. Schmitt氏が来日し、先日同社決算が発表されたことを受けて、会社説明会を開催する運びとなりました。今回の来日はMAP社IR部のご好意によるものです。ご多忙の折、恐縮ではございますが、ご出席を賜りたく下記の通りご案内申し上げます。\n記　日時：3月17日（水）11:30〜13:00（受付11:00〜）　場所：ホテル○○芙蓉の間\n講演者：（株）MAP財務担当役員 Mr. Rolf Schmitt　司会進行：弊社アナリスト安田一男", question:"これを受け取った人は何に招待されましたか。", options:["アナリストミーティング","会社説明会","企業IRとのミーティング","決算発表会"], correct:1, explain:"Chính văn nêu rõ: nhân dịp giám đốc tài chính công ty MAP (châu Âu) sang Nhật sau khi công ty công bố quyết toán, ngân hàng tổ chức 'buổi giải thích công ty' (会社説明会) và mời người nhận tham dự → đáp án 2." },
    { id:"rd-11", topic:"事故報告書", passage:"人身事故が起こったパソコン製造工場の責任者が、社長へ次のような事故報告書を提出しました。この事故の背景はどんなことですか。\n\n事故報告書\n1. 事故の状況：昨日15時30分ごろ第1倉庫内において、担当者Aが製品の出荷作業をしておりましたところ、積み上げてあった段ボール箱が荷崩れを起こしてAの頭部に当たり負傷しました。すぐ病院に連れて行き診察を受けましたが、全治2週間と診断されました。\n2. 事故原因：事故の直接的な原因は、本来3段積みと規定されている作業標準を守らず、不安定な4段に積んでいたことにあります。その他、現状の段ボール箱の強度にも問題があったことも判明しました。しかしながらこのような事故が発生した背景には、最近パソコンの在庫が急増したことがあります。このため外部業者への保管委託等の対策を取りましたが、増加分全部を減らすことはできず、応急対策として通路に置いたり4段積みにしたりせざるを得ませんでした。\n3. 今後の対策：……", question:"この事故の背景はどんなことですか。", options:["作業標準を守らなかったこと。","段ボール箱の強度が不足していたこと。","在庫製品の数量が急増してきたこと。","在庫品保管の外部委託対策を取らなかったこと。"], correct:2, explain:"Câu hỏi hỏi về 'bối cảnh' (背景), không phải 'nguyên nhân trực tiếp' (作業標準違反 và độ bền thùng carton — đó là 直接的な原因). Đoạn văn nói rõ: 'しかしながら...背景には、最近パソコンの在庫が急増したことがあります' → bối cảnh sâu xa là lượng tồn kho tăng đột biến → đáp án 3." },
    { id:"rd-12", topic:"4社の業績比較グラフ", passage:"同業4社の業績を比較しました。次の記事はどの会社の説明ですか。\n\nしばらくの間、売上が伸び悩んでいた同社だが、積極的な海外展開が奏功し、昨年は売上が急増した。他方、利益面では着実な合理化と新製品の投入効果が実って順調な伸びを続けており、首位には及ばなかったものの昨年も好成績であった。\n\n（グラフ：4社の売上推移・純益比較、5年前〜1年前の推移、A社B社C社D社）", question:"次の記事はどの会社の説明ですか。", options:["A社","B社","C社","D社"], correct:2, explain:"3 gợi ý: (1) 'năm ngoái doanh số tăng vọt' → C社 hoặc D社 (đường tăng mạnh cuối biểu đồ); (2) 'lợi nhuận tăng đều liên tục' → B社 hoặc C社; (3) 'lợi nhuận năm ngoái tốt nhưng chưa đứng đầu' → C社. Giao của cả 3 điều kiện → C社 → đáp án 3." },
    { id:"rd-13", topic:"Eメールへの返信（書き出し）", passage:"次のようなEメールが来たので返事を出します。書き出しはどのように書きますか。\n\n送信者：David Smith　件名：液晶パネルの件\n株式会社JL電気　営業部　佐藤一様\n\nお世話になっております。東京貿易のスミスです。先日はご多用のところをご来社くださり、ありがとうございました。そのとき、資料を拝見した液晶パネルの件ですが、本日アメリカの得意先より購入を検討したいとの連絡がありました。つきましては、下記の条件で見積りをお願いいたします。\n1. 品名：液晶パネルA-246　2. 数量：1,000台　3. 支払い条件など：基本取引契約の条件による　4. 見積り納期：8月12日\nなお、ご不明な点がありましたら担当までお問い合わせください。\n東京貿易株式会社　米州部　David Smith", question:"書き出しはどのように書きますか。", options:["液晶パネルのご注文をいただき、ありがとうございました。","液晶パネルの件でご来社いただき、ありがとうございました。","液晶パネルの見積りをご依頼いただき、ありがとうございました。","液晶パネルの資料をご請求いただき、ありがとうございました。"], correct:2, explain:"Nội dung email gốc là YÊU CẦU BÁO GIÁ (見積りをお願いいたします), không phải đặt hàng (注文), không phải chỉ đến thăm công ty, không phải chỉ xin tài liệu. Vậy câu mở đầu thư trả lời nên cảm ơn đúng về việc 'đã yêu cầu báo giá' → đáp án 3." },
    { id:"rd-14", topic:"創立記念式典でのあいさつ", passage:"東京エレクロニクス創立30周年記念式典でされた、あいさつのいくつかが社内報に載りました。次のあいさつは誰のものですか。\n\n創立30周年を迎え、心よりお祝い申し上げます。業界の非常に厳しい環境にもかかわらず、当社が順調に創立30周年を迎えられることに対し、OBとして格別の喜びを感じております。\n私が経営の任に当たりましたのは平成5年から4年間でございますが、ちょうどバブル経済が崩壊してどこの企業も生き残りに懸命な時代でありました。当社も既に前年には赤字転落しており、私としても先行きに大変な危機感を持っておりました。そこで、私が最初に着手しましたのは徹底的な無駄の排除運動でした。……", question:"次のあいさつは誰のものですか。", options:["現社長","取引銀行頭取","労働組合委員長","元社長"], correct:3, explain:"Từ khóa: 'OBとして' (là người đã nghỉ hưu / cựu nhân viên của công ty) và '私が経営の任に当たりましたのは……4年間' (tôi từng đảm nhiệm việc điều hành trong 4 năm — nghĩa là NGUYÊN GIÁM ĐỐC, không phải giám đốc hiện tại) → đáp án 4 (元社長)." },
    { id:"rd-15", topic:"慶弔見舞金規程", passage:"勤続7カ月の女性社員が勤続8年の男性と社内結婚します。規程によると、二人の結婚祝い金はいくらですか。\n\n慶弔見舞金規程\n第1条（目的）：この規程は、社員並びにその家族の慶弔禍福に際し、会社が祝福、弔意、見舞いの意を表し、金品を支給することに関して定めたものである。\n第2条（受給資格）：この規程は、勤続6カ月以上の社員を対象とする。\n第3条（種類）：慶弔見舞金の種類は、次の通りとする。(1)結婚祝い金 (2)出産祝い金 (3)見舞金\n第4条（結婚祝い金）：社員が結婚した場合には、次の通りの結婚祝い金を支給する。\n(1)勤続1年未満　1万円　(2)勤続1年以上5年未満　3万円　(3)勤続5年以上　7万円\n両者が社員の場合は、おのおのに支給する。", question:"二人の結婚祝い金はいくらですか。", options:["1万円","7万円","8万円","10万円"], correct:2, explain:"Cả hai đều đủ điều kiện (từ 6 tháng trở lên - 第2条). Theo 第4条: nữ (7 tháng, dưới 1 năm) = 1万円; nam (8 năm, từ 5 năm trở lên) = 7万円. Vì cả hai đều là nhân viên nên MỖI NGƯỜI được nhận riêng ('おのおのに支給する') → tổng 1万+7万 = 8万円 → đáp án 3." },
  ];

  const PRAISE = ['Chính xác! 🎯','Tuyệt vời! ✅','Giỏi lắm! 👏','Chuẩn không cần chỉnh! 🔥','Quá đỉnh! ✨','Đúng phóc! 💯','Đúng nhịp luôn! 🎶','Ngon lành! 🎤'];
  const CORRECTION = ['Chưa đúng rồi 😅','Sai mất rồi, xem lại nhé','Chưa chuẩn đâu','Trật rồi, cùng xem lại nào','Gần đúng nhưng chưa phải 🤔'];
  function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
  function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

  function buildDefaultData() {
    const items = {};
    TIERS.forEach(t => t.items.forEach((it, idx) => { const id=tierItemId(t,idx,it); items[id]=DEFAULT_STATUS[id]!==undefined?DEFAULT_STATUS[id]:0; }));
    KANJI_VOCAB.forEach(k => { items[k.id]=0; });
    allQuizzableItems().forEach(i => { if(items[i.id]===undefined) items[i.id]=0; });
    LISTEN_SECTIONS.forEach(sec => sec.items.forEach(it => { items[it.id]=0; }));
    return { items, studyDates: [], srs: {}, examHistory: [] };
  }
  function migrateData(data) {
    if(!data.items) data.items={};
    if(!data.studyDates) data.studyDates=[];
    if(!data.srs) data.srs={};
    if(!data.examHistory) data.examHistory=[];
    TIERS.forEach(t => t.items.forEach((it, idx) => { const id=tierItemId(t,idx,it); if(data.items[id]===undefined) data.items[id]=DEFAULT_STATUS[id]!==undefined?DEFAULT_STATUS[id]:0; }));
    KANJI_VOCAB.forEach(k => { if(data.items[k.id]===undefined) data.items[k.id]=0; });
    allQuizzableItems().forEach(i => { if(data.items[i.id]===undefined) data.items[i.id]=0; });
    LISTEN_SECTIONS.forEach(sec => sec.items.forEach(it => { if(data.items[it.id]===undefined) data.items[it.id]=0; }));
    return data;
  }
  function totalItems() { return TIERS.reduce((s,t)=>s+t.items.length,0); }
  function masteredCount() { let c=0; TIERS.forEach(t=>t.items.forEach((it,idx)=>{ if(DATA.items[tierItemId(t,idx,it)]===2) c++; })); return c; }
  function kanjiMasteredCount() { return KANJI_VOCAB.filter(k=>(DATA.items[k.id]||0)===2).length; }
  function listenMasteredCount(sec) { return sec.items.filter(it=>(DATA.items[it.id]||0)===2).length; }

  /* ===================== STATE ===================== */
  let DATA = null;
  let currentTab = 'dash';
  let cardState = null;
  let quizState = null;
  let examState = null;
  let comboState = null;
  let listenState = null;
  let ttsVoice = null;
  if ('speechSynthesis' in window) {
    const pickJaVoice = () => { const vs=window.speechSynthesis.getVoices(); ttsVoice = vs.find(v=>v.lang==='ja-JP') || vs.find(v=>v.lang&&v.lang.startsWith('ja')) || null; };
    pickJaVoice();
    window.speechSynthesis.onvoiceschanged = pickJaVoice;
  }

  function fmtDate(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+day; }
  function computeCurrentStreak(datesSet){
    const today=new Date(); today.setHours(0,0,0,0); let cursor=new Date(today);
    if(!datesSet.has(fmtDate(today))){ cursor.setDate(cursor.getDate()-1); if(!datesSet.has(fmtDate(cursor))) return 0; }
    let streak=0; while(datesSet.has(fmtDate(cursor))){ streak++; cursor.setDate(cursor.getDate()-1); } return streak;
  }
  function computeBestStreak(datesArr){
    const uniq=Array.from(new Set(datesArr)).sort(); if(uniq.length===0) return 0;
    let best=1,cur=1;
    for(let i=1;i<uniq.length;i++){ const diff=Math.round((new Date(uniq[i])-new Date(uniq[i-1]))/86400000); cur=diff===1?cur+1:1; if(cur>best) best=cur; }
    return best;
  }
  async function loadData(){
    if (HAS_CLAUDE_STORAGE) {
      try{ const res=await window.storage.get(STORAGE_KEY,false); if(res&&res.value) return JSON.parse(res.value); }catch(e){}
      return buildDefaultData();
    }
    try{ const raw=localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
    return buildDefaultData();
  }
  let lastSaveError = null;
  async function saveData(){
    const payload = JSON.stringify(DATA);
    if (!HAS_CLAUDE_STORAGE) {
      try { localStorage.setItem(STORAGE_KEY, payload); lastSaveError=null; return true; }
      catch(e){ lastSaveError=(e&&(e.message||e.toString()))||'Lỗi không xác định'; showSaveErrorBanner(); return false; }
    }
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        await window.storage.set(STORAGE_KEY, payload, false);
        lastSaveError = null;
        return true;
      } catch (e) {
        console.error('Lỗi lưu dữ liệu (lần '+attempt+'):', e);
        lastSaveError = (e && (e.message || e.toString())) || 'Lỗi không xác định';
        if (attempt < 3) await new Promise(r => setTimeout(r, 400 * attempt));
      }
    }
    showSaveErrorBanner();
    return false;
  }
  function showSaveErrorBanner(){
    let el = document.getElementById('saveErrorBanner');
    if (!el) {
      el = document.createElement('div');
      el.id = 'saveErrorBanner';
      el.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;max-width:588px;margin:0 auto;background:#3A1420;border:1.5px solid var(--pink);color:var(--pink);padding:12px 14px;border-radius:8px;font-family:var(--font-display);font-size:12.5px;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,0.5);';
      document.body.appendChild(el);
    }
    el.textContent = '⚠ Không lưu được tiến độ: ' + lastSaveError + ' — thử tải lại trang hoặc kiểm tra bạn đang mở file qua Claude (không phải file tải về).';
  }
  function setItemStatus(id, status){ DATA.items[id]=status; }

  /* ===================== SPACED REPETITION (SM-2 đơn giản hóa) ===================== */
  function todayStr(){ return fmtDate(new Date()); }
  function addDaysStr(dateStr, days){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+days); return fmtDate(d); }
  function initSRSIfNeeded(id){
    if(!DATA.srs) DATA.srs={};
    if(!DATA.srs[id]) DATA.srs[id] = { interval:0, ease:2.5, reps:0, due: todayStr() };
  }
  function reviewSRS(id, correct){
    initSRSIfNeeded(id);
    const s=DATA.srs[id];
    if(correct){
      s.reps++;
      if(s.reps===1) s.interval=1;
      else if(s.reps===2) s.interval=3;
      else s.interval=Math.max(1, Math.round(s.interval*s.ease));
      s.ease=Math.min(3.0, s.ease+0.05);
      s.due=addDaysStr(todayStr(), s.interval);
    } else {
      s.reps=0; s.interval=0; s.ease=Math.max(1.3, s.ease-0.2);
      s.due=todayStr(); // sai thì due ngay hôm nay để ôn lại sớm, không đợi qua ngày mai
    }
    s.lastReview=todayStr();
  }
  function findItemById(id){
    if(id.indexOf('kv-')===0) return KANJI_VOCAB.find(k=>k.id===id);
    return allQuizzableItems().find(i=>i.id===id);
  }
  function getDueItems(){
    if(!DATA.srs) return [];
    const today=todayStr();
    return Object.keys(DATA.srs)
      .filter(id => DATA.srs[id] && DATA.srs[id].due<=today)
      .map(findItemById).filter(Boolean);
  }

  function allQuizzableItems(){
    // Gộp mọi deck có cấu trúc quiz{sentence/term, options, correct} — dùng cho bộ lọc 苦手のみ toàn app.
    // Không gồm KANJI_VOCAB (quiz dựng động riêng) và READING_PASSAGES (dạng bài đọc, xử lý riêng ở 読解実践/模試).
    return [...STUDY_ITEMS, ...IDIOM_ITEMS, ...KATAKANA_ITEMS, ...GYOSEKI_ITEMS, ...SHANAI_ITEMS, ...TEIKEI_ITEMS];
  }
  function getDeck(key){
    if(key==='1a') return STUDY_ITEMS.filter(i=>i.id.startsWith('1a-'));
    if(key==='1b') return STUDY_ITEMS.filter(i=>i.id.startsWith('1b-'));
    if(key==='kgson') return STUDY_ITEMS.filter(i=>i.id.startsWith('kg-') && i.type==='son');
    if(key==='kgken') return STUDY_ITEMS.filter(i=>i.id.startsWith('kg-') && i.type==='ken');
    if(key==='idiom') return IDIOM_ITEMS;
    if(key==='katakana') return KATAKANA_ITEMS;
    if(key==='gyoseki') return GYOSEKI_ITEMS;
    if(key==='shanai') return SHANAI_ITEMS;
    if(key==='teikei') return TEIKEI_ITEMS;
    if(key==='weak') return allQuizzableItems().filter(i=>(DATA.items[i.id]||0)<2);
    if(key==='kanji') return KANJI_VOCAB;
    if(key==='all') return allQuizzableItems();
    return STUDY_ITEMS;
  }
  const DECKS = [
    ['1a','語彙・文法'], ['1b','表現読解'], ['kgson','敬語（尊敬語）'], ['kgken','敬語（謙譲語）'],
    ['idiom','慣用表現'], ['teikei','定型表現'], ['katakana','カタカナ語'],
    ['gyoseki','業績・景況'], ['shanai','社内文書・商取引'], ['kanji','漢字語彙'],
    ['weak','苦手のみ（全デッキ対象）'], ['all','全項目まとめて'],
  ];

  async function onStampToday(){
    const todayStr=fmtDate(new Date());
    if(!DATA.studyDates.includes(todayStr)){ DATA.studyDates.push(todayStr); await saveData(); render();
      const lastDot=document.querySelector('.stamp-day:last-child .stamp-dot');
      if(lastDot){ lastDot.classList.add('just-stamped'); setTimeout(()=>lastDot.classList.remove('just-stamped'),450); }
    }
  }
  async function onToggleItem(id){
    const cur=DATA.items[id]||0; const next=(cur+1)%3; DATA.items[id]=next; await saveData(); render();
    if(next===2){ const mark=document.querySelector('.item-row[data-id="'+id+'"] .item-mark'); if(mark){ mark.classList.add('just-stamped'); setTimeout(()=>mark.classList.remove('just-stamped'),450); } }
  }
  async function onReset(){
    if(!confirm('Xóa toàn bộ tiến độ và streak? Hành động này không thể hoàn tác.')) return;
    DATA=buildDefaultData(); await saveData(); render();
  }
  function onExportData(){
    const payload=JSON.stringify({ exportedAt:new Date().toISOString(), appVersion:'bjt-tracker-v2', data:DATA }, null, 2);
    const blob=new Blob([payload], {type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date(); const stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    a.href=url; a.download='bjt-tracker-backup-'+stamp+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }
  function onImportData(ev){
    const file=ev.target.files && ev.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=async ()=>{
      try{
        const parsed=JSON.parse(reader.result);
        const incoming=parsed.data || parsed; // hỗ trợ cả file export mới lẫn JSON DATA thô
        if(!incoming || typeof incoming!=='object' || !incoming.items) throw new Error('File không đúng định dạng backup của app này.');
        if(!confirm('Khôi phục dữ liệu từ file backup này? Toàn bộ tiến độ hiện tại sẽ bị GHI ĐÈ.')) return;
        DATA=migrateData(incoming);
        await saveData();
        render();
        alert('Đã khôi phục dữ liệu thành công!');
      }catch(e){
        alert('Không đọc được file: '+(e&&e.message?e.message:'định dạng không hợp lệ'));
      }
      ev.target.value='';
    };
    reader.readAsText(file);
  }

  /* ===================== RENDER: flashcards ===================== */
  function renderCardsTab(container){
    if(!cardState){ renderDeckPicker(container, 'cards'); return; }

    const readingHtml = readingVal ? '<div class="card-reading">'+readingVal+'</div>' : '';
    const backHtml = (item.explain === undefined)
      ? readingHtml+'<div class="card-meaning">'+item.meaning+'</div>'

    container.innerHTML =
      '<div class="card-deckbar"><button class="deckbar-back" id="deckBack">← デッキ選択</button><span class="card-progress">'+(cardState.idx+1)+' / '+cardState.deck.length+'</span></div>'+
      '<div class="flip-scene"><div class="flip-card'+(cardState.flipped?' flipped':'')+'" id="flipCard">'+
        '<div class="flip-face front"><span class="flip-hint">タップしてめくる</span><div class="card-term">'+item.term+'</div></div>'+
        '<div class="flip-face back"><span class="flip-hint">MEANING</span>'+backHtml+'</div>'+
      '</div></div>'+

      '<div class="card-nav"><button class="nav-btn" id="btnPrev"'+(cardState.idx===0?' disabled':'')+'>← 前へ</button><button class="nav-btn" id="btnNext"'+(cardState.idx===cardState.deck.length-1?' disabled':'')+'>次へ →</button></div>';
    document.getElementById('deckBack').addEventListener('click', ()=>{ cardState=null; render(); });
    document.getElementById('flipCard').addEventListener('click', ()=>{ cardState.flipped=!cardState.flipped; renderCardsTab(container); });
    document.getElementById('btnPrev').addEventListener('click', ()=>{ if(cardState.idx>0){ cardState.idx--; cardState.flipped=false; renderCardsTab(container);} });
    document.getElementById('btnNext').addEventListener('click', ()=>{ if(cardState.idx<cardState.deck.length-1){ cardState.idx++; cardState.flipped=false; renderCardsTab(container);} });
    document.getElementById('btnKnow').addEventListener('click', async ()=>{ setItemStatus(item.id,2); reviewSRS(item.id,true); await saveData(); advanceCard(container); });
    document.getElementById('btnAgain').addEventListener('click', async ()=>{ if((DATA.items[item.id]||0)<1) setItemStatus(item.id,1); reviewSRS(item.id,false); await saveData(); advanceCard(container); });

  function advanceCard(container){
    if(cardState.idx<cardState.deck.length-1){ cardState.idx++; cardState.flipped=false; renderCardsTab(container); }
    else { renderCardsTab(container); }
  }

  /* ===================== RENDER: quiz ===================== */
  function renderQuizTab(container){
    if(!quizState){ renderDeckPicker(container, 'quiz'); return; }
    if(quizState.idx>=quizState.list.length){ renderQuizResult(container); return; }
    const q=quizState.list[quizState.idx];
    let optsHtml='';
    q.options.forEach((opt,i)=>{
      let cls='quiz-opt';
      if(quizState.answered){ cls+=' disabled'; if(opt.isCorrect) cls+=' correct'; else if(i===quizState.selected) cls+=' wrong'; }
      const rd=READINGS[opt.text];
      const optLabel = rd ? '<span class="opt-reading">'+rd+'</span><span class="opt-term">'+opt.text+'</span>' : opt.text;
      optsHtml+='<button class="'+cls+'" data-i="'+i+'"'+(quizState.answered?' disabled':'')+'>'+optLabel+'</button>';
    });
    let feedbackHtml='';
    if(quizState.answered){
      const wasCorrect=q.options[quizState.selected].isCorrect;
      feedbackHtml='<div class="feedback-box '+(wasCorrect?'ok':'bad')+'"><div class="feedback-title">'+(wasCorrect?pick(PRAISE):pick(CORRECTION))+'</div><div class="feedback-explain">'+q.explain+'</div></div>'+
        '<button class="quiz-next-btn" id="quizNextBtn">'+(quizState.idx===quizState.list.length-1?'結果を見る':'次の問題へ')+'</button>';
    }
    // Furigana cho chính q.term: hiển thị ở mode 'meaning'/'situation' (không lộ đáp án, vì đáp án là nghĩa/tình huống
    // chứ không phải cách đọc). KHÔNG hiển thị ở mode 'reading' (漢字語彙) vì đó chính là điều đang được hỏi.
    const termReadingHtml = (q.mode==='meaning' || q.mode==='situation') && READINGS[q.term]
      ? '<div class="quiz-term-reading">'+READINGS[q.term]+'</div>' : '';
    const sentenceHtml = q.mode==='reading'
      ? '<div class="quiz-prompt">正しい読み方はどれですか？</div><div class="quiz-sentence kanji-term">'+q.term+'</div>'
      : q.mode==='meaning'
      ? '<div class="quiz-prompt">正しい意味はどれですか？</div>'+termReadingHtml+'<div class="quiz-sentence kanji-term">'+q.term+'</div>'
      : q.mode==='situation'
      ? '<div class="quiz-prompt">どんな場面で使う表現ですか？</div>'+termReadingHtml+'<div class="quiz-sentence">'+q.term+'</div>'
      : '<div class="quiz-sentence">'+q.sentence.replace(/＿＿＿/g,'<span class="blank">＿＿＿</span>')+'</div>';
    container.innerHTML =
      '<div class="card-deckbar"><button class="deckbar-back" id="deckBack">← デッキ選択</button><span class="card-progress">'+(quizState.idx+1)+' / '+quizState.list.length+'</span></div>'+
      '<div class="quiz-score">正解 '+quizState.score+' / '+quizState.idx+'</div>'+
      sentenceHtml +
      '<div class="quiz-options">'+optsHtml+'</div>'+
      feedbackHtml;
    document.getElementById('deckBack').addEventListener('click', ()=>{ quizState=null; render(); });
    if(!quizState.answered){
      container.querySelectorAll('.quiz-opt').forEach(btn=>btn.addEventListener('click', ()=>onSelectAnswer(container, parseInt(btn.getAttribute('data-i')))));
    } else {
      document.getElementById('quizNextBtn').addEventListener('click', ()=>{ quizState.idx++; quizState.answered=false; quizState.selected=null; renderQuizTab(container); });
    }
  }
  async function onSelectAnswer(container, i){
    const q=quizState.list[quizState.idx];
    quizState.answered=true; quizState.selected=i;
    const correct=q.options[i].isCorrect;
    if(correct) quizState.score++;
    setItemStatus(q.id, correct?2:1);
    reviewSRS(q.id, correct);
    await saveData();
    renderQuizTab(container);
  }
  function renderQuizResult(container){
    const pct=Math.round((quizState.score/quizState.list.length)*100);
    const backLabel = quizState.isReview ? '復習に戻る' : 'デッキ選択に戻る';
    container.innerHTML =
      '<div class="result-box"><div class="result-score">'+quizState.score+'/'+quizState.list.length+'</div><div class="result-label">正解率 '+pct+'%</div>'+
      '<div class="result-actions">'+(quizState.isReview?'':'<button class="quiz-next-btn" id="retrySame">もう一度</button>')+'<button class="nav-btn" id="backDeck">'+backLabel+'</button></div></div>';
    const retryBtn=document.getElementById('retrySame');
    if(retryBtn) retryBtn.addEventListener('click', ()=>{ startQuiz(quizState.deckKey); });
    document.getElementById('backDeck').addEventListener('click', ()=>{
      const wasReview=quizState.isReview; quizState=null;
      if(wasReview) renderReviewTab(container); else render();
    });
  }

  /* ===================== RENDER: 復習 (spaced repetition) ===================== */

  /* ===================== RENDER: listening (TTS-based) ===================== */
  function renderListenTab(container){

      if(listenState.submitted){ renderListenExamResult(container); return; }
      renderListenExamQuestion(container); return;
    }
    if(listenState.idx>=listenState.section.items.length){ renderListenResult(container); return; }
    const item=listenState.section.items[listenState.idx];
    const supported = ('speechSynthesis' in window);
    let optsHtml='';
    item.options.forEach((opt,i)=>{
      let cls='quiz-opt';
      const locked = !listenState.played;
      if(listenState.answered){ cls+=' disabled'; if(i===item.correct) cls+=' correct'; else if(i===listenState.selected) cls+=' wrong'; }
      else if(locked) cls+=' disabled';
      optsHtml+='<button class="'+cls+'" data-i="'+i+'"'+((listenState.answered||locked)?' disabled':'')+'>'+(i+1)+'. '+opt+'</button>';
    });
    let feedbackHtml='';
    if(listenState.answered){
      const wasCorrect=listenState.selected===item.correct;
      const hintHtml = (item.hint || item.explainVi) ? '<div class="hint-box">'+
        (item.hint ? '<b>ヒント：</b>\n'+item.hint+(item.point?'\n\n<b>ここがポイント！</b> '+item.point:'') : '')+
        (item.explainVi ? (item.hint?'\n\n':'')+'<b>🇻🇳 Giải thích (Tiếng Việt):</b>\n'+item.explainVi : '')+
        '</div>' : '';
      feedbackHtml='<div class="feedback-box '+(wasCorrect?'ok':'bad')+'"><div class="feedback-title">'+(wasCorrect?pick(PRAISE):pick(CORRECTION))+'</div>'+buildTranscriptHtml(item)+hintHtml+'</div>'+
        '<button class="quiz-next-btn" id="listenNextBtn">'+(listenState.idx===listenState.section.items.length-1?'結果を見る':'次の問題へ')+'</button>';

  function playScriptAudio(item, onDone /* onDone(usedReal:boolean) */){
    if(item.audioFile){
      const audio=new Audio(item.audioFile);
      let fellBack=false;
      const doFallback=()=>{ if(fellBack) return; fellBack=true; playScriptTTSRaw(item, ()=>onDone(false)); };
      audio.addEventListener('ended', ()=>onDone(true));
      audio.addEventListener('error', doFallback);
      const playPromise=audio.play();
      if(playPromise && playPromise.catch) playPromise.catch(doFallback);
      return;
    }
    playScriptTTSRaw(item, ()=>onDone(false));
  }
  function playScriptTTSRaw(item, onDone){
    if(!('speechSynthesis' in window)){ alert('このブラウザは音声合成(TTS)に対応していません。'); onDone(); return; }
    window.speechSynthesis.cancel();
    const lines=[];
    if(item.setup) lines.push({text:item.setup, spk:null});
    if(item.dialogue && item.dialogue.length){
      item.dialogue.forEach(d=>lines.push({text:d.text, spk:d.spk}));
      if(item.question) lines.push({text:item.question, spk:null});
    } else {
      item.options.forEach((opt,i)=>lines.push({text:(i+1)+'。'+opt, spk:null}));
    }
    let i=0;
    function next(){
      if(i>=lines.length){ onDone(); return; }
      const line=lines[i++];
      const u=new SpeechSynthesisUtterance(line.text);
      u.lang='ja-JP'; if(ttsVoice) u.voice=ttsVoice;
      u.rate=0.93;
      u.pitch = line.spk==='男' ? 0.8 : (line.spk==='女' ? 1.2 : 1.0);
      u.onend=next; u.onerror=next;
      window.speechSynthesis.speak(u);
    }
    next();
  }
  function buildTranscriptHtml(item){
    let html='<div class="transcript-box">';
    if(item.setup){
      html+='<div class="transcript-line"><span class="spk" style="background:transparent;color:var(--text-faint);">—</span><span>'+item.setup+'</span></div>';
    }
    if(item.dialogue && item.dialogue.length){
      item.dialogue.forEach(d=>{ html+='<div class="transcript-line"><span class="spk '+(d.spk==='男'?'m':'f')+'">'+d.spk+'</span><span>'+d.text+'</span></div>'; });
    } else {
      item.options.forEach((opt,i)=>{ html+='<div class="transcript-line"><span class="spk" style="background:transparent;color:var(--text-faint);">'+(i+1)+'</span><span>'+opt+'</span></div>'; });
    }
    html+='</div>';
    return html;
  }

  function fmtTime(sec){ const m=Math.floor(sec/60); const s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
  function stopExamTimer(){ if(examState && examState.timerHandle){ clearInterval(examState.timerHandle); examState.timerHandle=null; } }
  function startExamTimer(){
    stopExamTimer();
    examState.timerHandle = setInterval(()=>{
      if(!examState || examState.finished){ stopExamTimer(); return; }
      examState.remainingSec--;
      if(examState.remainingSec<=0){ examState.remainingSec=0; finishExam(true); return; }
      const timerEl=document.getElementById('examTimerDisplay');
      if(timerEl){ timerEl.textContent=fmtTime(examState.remainingSec); timerEl.classList.toggle('warn', examState.remainingSec<=300); }
    }, 1000);
  }
  function startExam(){
    const questions=buildMockExamQuestions();
    examState = {
      questions, answers:new Array(questions.length).fill(null), idx:0,
      durationSec:40*60, remainingSec:40*60, finished:false, result:null, timerHandle:null
    };
    startExamTimer();
    render();
  }
  async function finishExam(auto){
    stopExamTimer();
    const timeUsedSec=examState.durationSec-examState.remainingSec;
    let score=0; const sectionScores={};
    examState.questions.forEach((q,i)=>{
      const ans=examState.answers[i];
      const correct=ans!==null && q.options[ans].isCorrect;
      if(correct) score++;
      if(!sectionScores[q.section]) sectionScores[q.section]={correct:0,total:0};
      sectionScores[q.section].total++;
      if(correct) sectionScores[q.section].correct++;
    });
    examState.finished=true;
    examState.result={ score, total:examState.questions.length, sectionScores, timeUsedSec, auto };
    if(!DATA.examHistory) DATA.examHistory=[];
    DATA.examHistory.unshift({ date:new Date().toISOString(), score, total:examState.questions.length, timeUsedSec, sectionScores, auto });
    if(DATA.examHistory.length>20) DATA.examHistory=DATA.examHistory.slice(0,20);
    await saveData();
    render();
  }

      '<div class="exam-intro">'+
      '<button class="exam-start-btn" id="examStartBtn">模試を始める（35問・40分）→</button>'+
      '<button class="exam-start-btn" id="comboStartBtn" style="margin-top:10px;border-color:var(--teal);color:var(--teal-bright);">🎧 総合模試を始める（80問・105分／現行CBT形式）→</button>'+
      '<div style="font-size:11px;color:var(--text-faint);margin-top:8px;line-height:1.5;">総合模試は現行BJT（2017年〜CBT方式）の構成 — 聴解25問(45分)＋聴読解25問(30分)＋読解30問(30分) — に合わせて、書籍から抜粋した問題を選定したものです。書籍自体は旧版（CBT移行前）のため、実際の現行試験と出題内容は異なります。</div>'+
      '</div>'+histHtml;
    document.getElementById('examStartBtn').addEventListener('click', startExam);
    document.getElementById('comboStartBtn').addEventListener('click', startComboExam);
  }
  function renderExamQuestion(container){
    const q=examState.questions[examState.idx];
    const total=examState.questions.length;
    const answered=examState.answers[examState.idx];
    const contentHtml = q.mode==='passage'
      ? '<div class="exam-passage">'+q.passage+'</div><div class="quiz-sentence">'+q.question+'</div>'
      : '<div class="quiz-sentence">'+q.sentence.replace(/＿＿＿/g,'<span class="blank">＿＿＿</span>')+'</div>';
    let optsHtml='';
    q.options.forEach((opt,i)=>{
      optsHtml+='<button class="quiz-opt'+(answered===i?' exam-selected':'')+'" data-i="'+i+'">'+opt.text+'</button>';
    });
    const gridHtml=examState.questions.map((qq,i)=>{
      let cls='exam-grid-btn';
      if(i===examState.idx) cls+=' current';
      else if(examState.answers[i]!==null) cls+=' answered';
      return '<button class="'+cls+'" data-idx="'+i+'">'+(i+1)+'</button>';
    }).join('');
    container.innerHTML =
      '<div class="exam-topbar"><span id="examTimerDisplay" class="exam-timer'+(examState.remainingSec<=300?' warn':'')+'">'+fmtTime(examState.remainingSec)+'</span><button class="exam-submit-btn" id="examSubmitBtn">提出する</button></div>'+
      '<div class="exam-section-label">'+q.section+' ・ '+(examState.idx+1)+' / '+total+'</div>'+
      contentHtml+
      '<div class="quiz-options">'+optsHtml+'</div>'+
      '<div class="exam-grid">'+gridHtml+'</div>'+
      '<div class="exam-nav"><button id="examPrevBtn"'+(examState.idx===0?' disabled':'')+'>← 前へ</button><button id="examNextBtn"'+(examState.idx===total-1?' disabled':'')+'>次へ →</button></div>';
    container.querySelectorAll('.quiz-opt').forEach(btn=>btn.addEventListener('click', ()=>{
      examState.answers[examState.idx]=parseInt(btn.getAttribute('data-i'));
      renderExamQuestion(container);
    }));
    container.querySelectorAll('.exam-grid-btn').forEach(btn=>btn.addEventListener('click', ()=>{
      examState.idx=parseInt(btn.getAttribute('data-idx'));
      renderExamQuestion(container);
    }));
    const prevBtn=document.getElementById('examPrevBtn'); if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(examState.idx>0){ examState.idx--; renderExamQuestion(container); } });
    const nextBtn=document.getElementById('examNextBtn'); if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(examState.idx<total-1){ examState.idx++; renderExamQuestion(container); } });
    document.getElementById('examSubmitBtn').addEventListener('click', ()=>{
      const unanswered=examState.answers.filter(a=>a===null).length;
      const msg=unanswered>0 ? ('まだ'+unanswered+'問未回答です。本当に提出しますか？') : '提出しますか？提出後は変更できません。';
      if(confirm(msg)) finishExam(false);
    });
  }
  function renderExamResult(container){
    const r=examState.result;
    const sectionRows=Object.keys(r.sectionScores).map(sec=>{
      const s=r.sectionScores[sec];
      return '<div class="exam-history-row"><span>'+sec+'</span><span class="exam-history-score">'+s.correct+'/'+s.total+'</span></div>';
    }).join('');
    const reviewHtml=examState.questions.map((q,i)=>{
      const ans=examState.answers[i];
      const correct=ans!==null && q.options[ans].isCorrect;
      const correctOpt=q.options.find(o=>o.isCorrect);
      const qLabel=q.mode==='passage' ? (q.topic+' — '+q.question) : q.sentence.replace(/＿＿＿/g,'＿＿＿');
      return '<div class="exam-review-item '+(correct?'':'wrong')+'">'+
        '<div class="exam-review-q">'+(i+1)+'. ['+q.section+']<br>'+qLabel+'</div>'+
        '<div class="exam-review-ans '+(correct?'ok':'bad')+'">Bạn chọn: '+(ans!==null?q.options[ans].text:'(bỏ trống)')+(correct?' ✓':' ✗ — Đáp án đúng: '+correctOpt.text)+'</div>'+
        '<div class="feedback-explain" style="margin-top:6px;">'+q.explain+'</div>'+
        '</div>';
    }).join('');
    container.innerHTML =
      '<div class="result-box" style="padding-top:6px;">'+
        '<div class="result-score">'+r.score+'/'+r.total+'</div>'+
        '<div class="result-label">正解率 '+Math.round(r.score/r.total*100)+'% ・ 所要時間 '+fmtTime(r.timeUsedSec)+(r.auto?'（時間切れ自動提出）':'')+'</div>'+
      '</div>'+
      '<div class="exam-result-section"><h3>セクション別スコア</h3>'+sectionRows+'</div>'+
      '<div class="exam-result-section"><h3>解答確認（全'+r.total+'問）</h3>'+reviewHtml+'</div>'+
      '<div class="result-actions" style="margin-top:16px;"><button class="quiz-next-btn" id="examBackBtn">模試トップに戻る</button></div>';
    document.getElementById('examBackBtn').addEventListener('click', ()=>{ examState=null; render(); });
  }

  /* ===================== 総合模試 (combo exam: listening + reading, matches current CBT format) ===================== */
  function buildComboExamParts(){
    const findSec = id => LISTEN_SECTIONS.find(s=>s.id===id);
    const l1=findSec('l1').items, l2=findSec('l2').items, l3=findSec('l3').items;
    const l4=findSec('l4').items, l5=findSec('l5').items;
    const listenQs = [
      ...l1.slice(0,5).map(item=>({kind:'listen', item, section:'聴解・場面把握'})),
      ...l2.slice(0,10).map(item=>({kind:'listen', item, section:'聴解・発言聴解'})),
      ...l3.slice(0,10).map(item=>({kind:'listen', item, section:'聴解・総合聴解'})),
    ];
    const listenReadQs = [
      ...l4.slice(0,15).map(item=>({kind:'listen', item, section:'聴読解・資料聴読解'})),
      ...l5.slice(0,10).map(item=>({kind:'listen', item, section:'聴読解・総合聴読解'})),
    ];
    const sec1 = shuffle(STUDY_ITEMS.filter(i=>i.id.startsWith('1a-'))).slice(0,10).map(item=>{
      const opts=item.quiz.options.map((text,i)=>({text, isCorrect:i===item.quiz.correct}));
      return { kind:'read', section:'読解・語彙文法', item:{ mode:'sentence', sentence:item.quiz.sentence, explain:item.explain, options:shuffle(opts) } };
    });
    const sec2 = shuffle(STUDY_ITEMS.filter(i=>i.id.startsWith('1b-'))).slice(0,10).map(item=>{
      const opts=item.quiz.options.map((text,i)=>({text, isCorrect:i===item.quiz.correct}));
      return { kind:'read', section:'読解・表現読解', item:{ mode:'sentence', sentence:item.quiz.sentence, explain:item.explain, options:shuffle(opts) } };
    });
    const sec3 = shuffle(READING_PASSAGES).slice(0,10).map(item=>{
      const opts=item.options.map((text,i)=>({text, isCorrect:i===item.correct}));
      return { kind:'read', section:'読解・総合読解', item:{ mode:'passage', topic:item.topic, passage:item.passage, question:item.question, explain:item.explain, options:shuffle(opts) } };
    });
    const readQs = [...sec1, ...sec2, ...sec3];
    return [
      { label:'第1部 聴解', durationSec:45*60, questions: listenQs },
      { label:'第2部 聴読解', durationSec:30*60, questions: listenReadQs },
      { label:'第3部 読解', durationSec:30*60, questions: readQs },
    ];
  }
  function startComboExam(){
    const parts = buildComboExamParts().map(p=>({
      ...p, remainingSec: p.durationSec,
      answers: new Array(p.questions.length).fill(null),
      played: new Array(p.questions.length).fill(false),
      usedReal: new Array(p.questions.length).fill(null),
    }));
    comboState = { parts, partIdx:0, idx:0, playing:false, finished:false, result:null, timerHandle:null };
    startComboTimer();
    render();
  }
  function stopComboTimer(){ if(comboState && comboState.timerHandle){ clearInterval(comboState.timerHandle); comboState.timerHandle=null; } }
  function startComboTimer(){
    stopComboTimer();
    comboState.timerHandle = setInterval(()=>{
      if(!comboState || comboState.finished){ stopComboTimer(); return; }
      const part = comboState.parts[comboState.partIdx];
      part.remainingSec--;
      if(part.remainingSec<=0){ part.remainingSec=0; advanceComboPart(); return; }
      const timerEl=document.getElementById('comboTimerDisplay');
      if(timerEl){ timerEl.textContent=fmtTime(part.remainingSec); timerEl.classList.toggle('warn', part.remainingSec<=300); }
    }, 1000);
  }
  function advanceComboPart(){
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    if(comboState.partIdx < comboState.parts.length-1){
      comboState.partIdx++; comboState.idx=0; comboState.playing=false;
      startComboTimer();
      render();
    } else {
      finishComboExam();
    }
  }
  async function finishComboExam(){
    stopComboTimer();
    let totalScore=0, totalQ=0;
    const partResults = comboState.parts.map(part=>{
      let score=0;
      part.questions.forEach((q,i)=>{
        const ans=part.answers[i];
        let correct=false;
        if(q.kind==='listen'){ correct = ans!==null && ans===q.item.correct; }
        else { correct = ans!==null && q.item.options[ans].isCorrect; }
        if(correct) score++;
      });
      totalScore+=score; totalQ+=part.questions.length;
      return { label:part.label, score, total:part.questions.length };
    });
    comboState.finished=true;
    comboState.result = { totalScore, totalQ, partResults };
    if(!DATA.comboExamHistory) DATA.comboExamHistory=[];
    DATA.comboExamHistory.unshift({ date:new Date().toISOString(), totalScore, totalQ, partResults });
    if(DATA.comboExamHistory.length>20) DATA.comboExamHistory=DATA.comboExamHistory.slice(0,20);
    await saveData();
    render();
  }
  function renderComboContent(container){
    if(comboState.finished){ renderComboResult(container); return; }
    renderComboQuestion(container);
  }
  function onComboPlay(container, item, idx){
    const part = comboState.parts[comboState.partIdx];
    comboState.playing=true; renderComboQuestion(container);
    playScriptAudio(item, (usedReal)=>{ comboState.playing=false; part.played[idx]=true; part.usedReal[idx]=usedReal; renderComboQuestion(container); });
  }
  function renderComboQuestion(container){
    const part = comboState.parts[comboState.partIdx];
    const idx = comboState.idx;
    const q = part.questions[idx];
    const total = part.questions.length;
    let bodyHtml=''; let optsHtml=''; let playedNow=true;
    if(q.kind==='listen'){
      const item=q.item;
      playedNow = part.played[idx];
      const usedReal = part.usedReal[idx];
      bodyHtml = (item.image?'<img src="'+item.image+'" alt="" class="listen-photo">':'')+
        '<button class="play-btn'+(comboState.playing?' playing':'')+'" id="comboPlayBtn"'+(comboState.playing?' disabled':'')+'>'+
          (comboState.playing
            ? '<span class="eq-bars"><span></span><span></span><span></span><span></span><span></span></span><span>再生中…</span>'
            : '<span class="play-btn-icon">▶</span><span>'+(playedNow?'もう一度聴く':(item.audioFile?'音声を再生する（CD音源）':'音声を再生する（TTS）'))+'</span>')+
        '</button>'+
        (!playedNow ? '<div class="listen-locked-note">🔒 まず音声を聴いてから回答を選んでください</div>' : '<div class="listen-locked-note">'+(usedReal?'🎧 CD音源':'🗣️ TTS合成音声')+'</div>');
      item.options.forEach((opt,i)=>{
        let cls='quiz-opt'+(part.answers[idx]===i?' exam-selected':'');
        optsHtml+='<button class="'+cls+'" data-i="'+i+'"'+(!playedNow?' disabled':'')+'>'+(i+1)+'. '+opt+'</button>';
      });
    } else {
      const item=q.item;
      bodyHtml = item.mode==='passage'
        ? '<div class="exam-passage">'+item.passage+'</div><div class="quiz-sentence">'+item.question+'</div>'
        : '<div class="quiz-sentence">'+item.sentence.replace(/＿＿＿/g,'<span class="blank">＿＿＿</span>')+'</div>';
      item.options.forEach((opt,i)=>{
        optsHtml+='<button class="quiz-opt'+(part.answers[idx]===i?' exam-selected':'')+'" data-i="'+i+'">'+opt.text+'</button>';
      });
    }
    const gridHtml=part.questions.map((qq,i)=>{
      let cls='exam-grid-btn';
      if(i===idx) cls+=' current';
      else if(part.answers[i]!==null) cls+=' answered';
      return '<button class="'+cls+'" data-idx="'+i+'">'+(i+1)+'</button>';
    }).join('');
    container.innerHTML =
      '<div class="exam-topbar"><span id="comboTimerDisplay" class="exam-timer'+(part.remainingSec<=300?' warn':'')+'">'+fmtTime(part.remainingSec)+'</span><button class="exam-submit-btn" id="comboSubmitBtn">'+(comboState.partIdx===comboState.parts.length-1?'提出する':'次のパートへ')+'</button></div>'+
      '<div class="exam-section-label">'+part.label+' ・ '+q.section+' ・ '+(idx+1)+' / '+total+'</div>'+
      bodyHtml+
      '<div class="quiz-options">'+optsHtml+'</div>'+
      '<div class="exam-grid">'+gridHtml+'</div>'+
      '<div class="exam-nav"><button id="comboPrevBtn"'+(idx===0?' disabled':'')+'>← 前へ</button><button id="comboNextBtn"'+(idx===total-1?' disabled':'')+'>次へ →</button></div>';
    if(q.kind==='listen'){
      document.getElementById('comboPlayBtn').addEventListener('click', ()=>onComboPlay(container, q.item, idx));
    }
    if(q.kind!=='listen' || playedNow){
      container.querySelectorAll('.quiz-opt').forEach(btn=>btn.addEventListener('click', ()=>{
        part.answers[idx]=parseInt(btn.getAttribute('data-i'));
        renderComboQuestion(container);
      }));
    }
    container.querySelectorAll('.exam-grid-btn').forEach(btn=>btn.addEventListener('click', ()=>{ comboState.idx=parseInt(btn.getAttribute('data-idx')); renderComboQuestion(container); }));
    const prevBtn=document.getElementById('comboPrevBtn'); if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(comboState.idx>0){ comboState.idx--; renderComboQuestion(container); } });
    const nextBtn=document.getElementById('comboNextBtn'); if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(comboState.idx<total-1){ comboState.idx++; renderComboQuestion(container); } });
    document.getElementById('comboSubmitBtn').addEventListener('click', ()=>{
      const isLast = comboState.partIdx===comboState.parts.length-1;
      const unanswered = part.answers.filter(a=>a===null).length;
      let msg = unanswered>0 ? 'まだ'+unanswered+'問未回答です。\n\n' : '';
      msg += isLast ? '本当に提出しますか？提出後は変更できません。' : '次のパートに進みますか？このパートには戻れません。';
      if(confirm(msg)) advanceComboPart();
    });
  }
  function renderComboResult(container){
    const r = comboState.result;
    const pct = Math.round((r.totalScore/r.totalQ)*100);
    const partsHtml = r.partResults.map(p=>'<div class="kanji-summary" style="margin-bottom:8px;"><div class="kanji-summary-text">'+p.label+'<br><b>'+p.score+'</b> / '+p.total+' 問正解</div></div>').join('');
    let reviewHtml = '';
    comboState.parts.forEach(part=>{
      reviewHtml += '<h3 style="margin-top:20px;color:var(--teal-bright);">'+part.label+'</h3>';
      part.questions.forEach((q,i)=>{
        const ans=part.answers[i];
        let correct, correctText, chosenText, qLabel, detailHtml;
        if(q.kind==='listen'){
          const item=q.item;
          correct = ans!==null && ans===item.correct;
          correctText = (item.correct+1)+'. '+item.options[item.correct];
          chosenText = ans!==null ? (ans+1)+'. '+item.options[ans] : '(bỏ trống)';
          qLabel = item.question || item.setup || '写真・資料を見て選んでください。';
          const imgHtml = item.image ? '<img src="'+item.image+'" alt="" class="listen-photo" style="margin-top:8px;">' : '';
          const hintHtml = (item.hint || item.explainVi) ? '<div class="hint-box">'+
        (item.hint ? '<b>ヒント：</b>\n'+item.hint+(item.point?'\n\n<b>ここがポイント！</b> '+item.point:'') : '')+
        (item.explainVi ? (item.hint?'\n\n':'')+'<b>🇻🇳 Giải thích (Tiếng Việt):</b>\n'+item.explainVi : '')+
        '</div>' : '';
          detailHtml = imgHtml + buildTranscriptHtml(item) + hintHtml;
        } else {
          const item=q.item;
          const correctIdx = item.options.findIndex(o=>o.isCorrect);
          correct = ans!==null && item.options[ans].isCorrect;
          correctText = (correctIdx+1)+'. '+item.options[correctIdx].text;
          chosenText = ans!==null ? (ans+1)+'. '+item.options[ans].text : '(bỏ trống)';
          qLabel = item.mode==='passage' ? item.question : item.sentence.replace(/＿＿＿/g,'___');
          const passageHtml = item.mode==='passage' ? '<div class="exam-passage" style="margin-top:8px;">'+item.passage+'</div>' : '';
          detailHtml = passageHtml + (item.explain ? '<div class="feedback-explain" style="margin-top:8px;">'+item.explain+'</div>' : '');
        }
        reviewHtml += '<div class="exam-review-item '+(correct?'':'wrong')+'"><div class="exam-review-q">'+(i+1)+'. ['+q.section+']<br>'+qLabel+'</div>'+
          '<div class="exam-review-ans '+(correct?'ok':'bad')+'">Bạn chọn: '+chosenText+(correct?' ✓':' ✗ — Đáp án đúng: '+correctText)+'</div>'+
          detailHtml+
          '</div>';
      });
    });
    container.innerHTML =
      '<div class="result-box" style="padding-top:6px;"><div class="result-score">'+r.totalScore+'/'+r.totalQ+'</div><div class="result-label">正解率 '+pct+'%（総合模試）</div></div>'+
      '<div>'+partsHtml+'</div>'+
      '<div class="exam-result-section"><h3>解答確認</h3>'+reviewHtml+'</div>'+
      '<div class="result-actions" style="margin-top:16px;"><button class="quiz-next-btn" id="comboBackBtn">模試トップに戻る</button></div>';
    document.getElementById('comboBackBtn').addEventListener('click', ()=>{ comboState=null; render(); });
  }

  /* ===================== init ===================== */
  (async function init(){ DATA=migrateData(await loadData()); render(); })();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        // Trình duyệt mặc định chỉ tự kiểm tra bản mới ~1 lần/24h. Gọi update() ngay mỗi lần
        // mở app để luôn lấy bản mới nhất mà không cần tự tay xóa cache.
        reg.update();
      }).catch(() => { /* im lặng khi không hỗ trợ (ví dụ trong Claude) */ });
    });
    // Khi service worker mới đã sẵn sàng và tiếp quản, tự tải lại trang 1 lần duy nhất
    // để hiển thị ngay bản mới — không cần người dùng tự xóa cache hay bấm gì cả.
    let swReloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (swReloaded) return;
      swReloaded = true;
      window.location.reload();
    });
  }
})();
</script>
